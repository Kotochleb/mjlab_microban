[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "mjlab-microban"
version = "0.1.0"
description = "Microban RL environment for mjlab"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
  "mjlab==1.3.0",
  "warp-lang==1.12.0",
  "placo>=0.9.20",
  "better-actuator-models",
  "scipy"
]

[project.entry-points."mjlab.tasks"]
mjlab_microban = "mjlab_microban.tasks"

[tool.ruff]
src = ["src"]  # Helpful for recognizing first-party imports.
indent-width = 4
exclude = [
  "src/mjlab/third_party",
  "typings",
]

# Only bam's mjlab integration (bam.mjlab) is used, so skip its identification
# deps. In particular its protobuf<4 pin would force onnx 1.17, which has no
# cp313 wheels and fails to build.
[[tool.uv.dependency-metadata]]
name = "better-actuator-models"
version = "1.0.0"
requires-dist = ["numpy", "colorama"]

# rsl_rl passes wandb.Settings(start_method=...), which some wandb releases
# reject (pydantic extra_forbidden). 0.25.0 accepts it as a deprecated no-op.
[tool.uv]
override-dependencies = ["wandb==0.25.0"]

[tool.uv.sources]
better-actuator-models = { git = "ssh://git@github.com/rhoban/bam", branch = "doc" }
